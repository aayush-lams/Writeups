{{ define "title" }}{{ .Site.Title }}{{ end }}
{{ define "main" }}
<section id="home" class="pageSection homeSection">
  <h2 class="pageHead">Writeups</h2>
  <p class="desc">{{ .Site.Params.description }}</p>
  <h2 class="categoriesHead">Categories</h2>
  <ul class="workList">
    {{ range .Site.Menus.main }}
    {{ if not (eq .Name "Home") }}
    <li><a href="{{ .URL }}">
        <div class="workName">{{ .Name }}</div>
        <div class="workDescription">{{ .Name }} write-ups</div>
      </a></li>
    {{ end }}
    {{ end }}
  </ul>
</section>
{{ end }}
