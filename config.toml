baseURL = "https://aayush-lams.github.io/Writeups/"
title = "Writeups"
theme = "basic"

ignoreLogs = ['warning-home-page-is-leaf-bundle']

[taxonomies]
  category = "section"

[params]
  main_site = "https://aayush-lamsal.vercel.app"
  description = "Linux & Cybersecurity technical write-ups"

# NOTE: category is remapped to a section taxonomy (not a slug tag)
#       because some legacy writeups reuse 'category' to mean "section label".
#       Update only if you restructure all writeups consistently.

# Enable JSON output for search indexing
[outputs]
home = ["html", "searchjson"]
page = ["html"]
section = ["html"]

[outputFormats]
searchjson = { mediaType = "application/json", path = "search-index.json" }

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
  [[menu.main]]
    name = "Linux"
    url = "/linux/"
  [[menu.main]]
    name = "CTF"
    url = "/security/ctf/"
  [[menu.main]]
    name = "Security"
    url = "/security/projects/recon/"
  [[menu.main]]
    name = "Site Analysis"
    url = "/site-analysis/"
